<!DOCTYPE html>
<html>
<head>
  <title>Student Result System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --brand-1:#4f46e5;
      --brand-2:#7c3aed;
      --brand-grad: linear-gradient(135deg, var(--brand-1), var(--brand-2));
      --surface:#ffffff;
      --bg:#f3f4f8;
      --text-muted:#6b7280;
      --radius:14px;
    }

    body {
      background:var(--bg);
      padding:10px;
      font-family:'Poppins', system-ui, sans-serif;
      color:#1f2330;
    }

    /* ---------- Navbar ---------- */
    .navbar.result-nav{
      background:var(--brand-grad) !important;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(79,70,229,0.25);
    }
    .navbar-brand{
      font-weight:700;
      letter-spacing:.3px;
    }
    .result-nav .btn{
      border-radius:10px;
      font-weight:500;
      font-size:.9rem;
    }

    /* ---------- Search card ---------- */
    .search-card{
      background:var(--surface);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:0 4px 18px rgba(17,17,26,0.06);
      margin-bottom:20px;
    }
    .search-card .form-control{
      border-radius:10px;
      border:1px solid #e5e7eb;
      padding:.6rem .9rem;
    }
    .search-card .form-control:focus{
      border-color:var(--brand-1);
      box-shadow:0 0 0 .2rem rgba(79,70,229,.15);
    }
    .btn-primary{
      background:var(--brand-grad);
      border:none;
      border-radius:10px;
      font-weight:600;
      padding:.6rem 1rem;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary:hover{
      transform:translateY(-1px);
      box-shadow:0 6px 16px rgba(79,70,229,.35);
    }

    /* ---------- Result header ---------- */
    .result-header{
      background:var(--surface);
      border-radius:var(--radius);
      padding:22px 18px;
      text-align:center;
      box-shadow:0 4px 18px rgba(17,17,26,0.06);
      margin-bottom:18px;
    }
    .result-header h4{
      font-weight:700;
      margin-bottom:4px;
    }
    .cgpa-badge{
      display:inline-block;
      background:var(--brand-grad);
      color:#fff;
      padding:.35rem 1rem;
      border-radius:30px;
      font-weight:600;
      font-size:.95rem;
      margin-top:6px;
    }

    /* ---------- Semester cards ---------- */
    .card {
      cursor:pointer;
      border-radius:var(--radius);
      border:1px solid #eef0f4;
      box-shadow:0 3px 12px rgba(17,17,26,0.05);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 10px 24px rgba(79,70,229,0.15);
      border-color:#e0e0fb;
    }
    .card h5{
      font-weight:600;
      color:var(--brand-1);
    }
    .card .sem-meta{
      font-size:.88rem;
      color:var(--text-muted);
    }

    /* ---------- Modals ---------- */
    .modal-content{
      border-radius:16px;
      border:none;
      overflow:hidden;
    }
    .modal-header{
      background:var(--brand-grad);
      color:#fff;
      border-bottom:none;
    }
    .modal-header .btn-close{
      filter:invert(1) grayscale(100%) brightness(200%);
    }
    .modal-body { overflow-y:auto; }

    table.table{
      border-radius:10px;
      overflow:hidden;
    }
    table.table th{
      background:#f5f5fb;
    }

    .btn-danger, .btn-success, .btn-secondary, .btn-dark, .btn-info, .btn-warning, .btn-outline-primary{
      border-radius:10px;
    }

    .alert{
      border-radius:12px;
    }

    #notifyBox{ position:fixed; top:10px; right:10px; z-index:9999; }

    @media(max-width:576px){
      table { font-size:12px; }
      th,td { white-space:nowrap; }
      .navbar-brand{ font-size:1rem; }
    }
  </style>
</head>

<body>

<nav class="navbar result-nav navbar-dark px-3 mb-3 rounded">
  <span class="navbar-brand"><i class="bi bi-mortarboard-fill me-2"></i>Result Portal</span>

  <div>
    <button class="btn btn-info me-2" onclick="openManualRequestGlobal()">
      <i class="bi bi-pencil-square me-1"></i>Request Changes
    </button>
    <button class="btn btn-warning" onclick="openAdminLogin()">
      <i class="bi bi-shield-lock-fill me-1"></i>Admin
    </button>
  </div>
</nav>
<div id="notifyBox"></div>

<div class="container">

  <div class="search-card row mb-3 g-2">
    <div class="col-md-4">
      <input id="roll" class="form-control" placeholder="Roll Number">
    </div>

    <div class="col-md-4">
      <input id="name" class="form-control" placeholder="Full Name">
    </div>

    <div class="col-md-4">
      <button class="btn btn-primary w-100" onclick="loadData()">
        <i class="bi bi-search me-1"></i>Get Result
      </button>
    </div>
  </div>

  <div id="result" class="row"></div>

</div>
<div class="modal fade" id="sgpaModal">
  <div class="modal-dialog modal-xl modal-fullscreen-sm-down">
    <div class="modal-content">

      <div class="modal-header">
        <h5><i class="bi bi-calculator-fill me-2"></i>SGPA Calculator</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div id="sgpaBody"></div>

        <div class="mt-3 text-center">
          <button class="btn btn-success" onclick="calculateSGPA()">Calculate</button>
        </div>

        <div class="mt-3 text-center">
          <h5 id="sgpaResult"></h5>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- SEM MODAL -->
<div class="modal fade" id="subjectModal">
  <div class="modal-dialog modal-xl modal-fullscreen-sm-down">
    <div class="modal-content">

      <div class="modal-header">
        <h5><i class="bi bi-journal-text me-2"></i>Semester Details</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="modalBody"></div>

      <div class="modal-footer">
  <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
  <button class="btn btn-primary" onclick="openSgpaModal()">Calculate SGPA</button>
  <button class="btn btn-danger" onclick="openManualRequest()">Request Change</button>
</div>

    </div>
  </div>
</div>

<div class="modal fade" id="cgpaModal">
  <div class="modal-dialog modal-lg modal-fullscreen-sm-down">
    <div class="modal-content">

      <div class="modal-header">
        <h5><i class="bi bi-graph-up me-2"></i>CGPA Calculator</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <!-- Current CGPA -->
        <div class="mb-3">
          <label>Current CGPA</label>
          <input type="number" step="0.01" id="currentCgpa" class="form-control">
        </div>

        <!-- Semester blocks -->
        <div id="cgpaSemContainer"></div>

        <div class="text-center mt-3">
          <button class="btn btn-secondary" onclick="addSemBlock()">+ Add Semester</button>
        </div>

        <div class="text-center mt-4">
          <button class="btn btn-success" onclick="calculateCGPA()">Calculate CGPA</button>
        </div>

        <div class="text-center mt-3">
          <h5 id="cgpaResult"></h5>
          <h6 id="totalCredits"></h6>
        </div>

      </div>

    </div>
  </div>
</div>
<div class="modal fade" id="successModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-3">

      <div class="modal-body">
        <h5 class="text-success"><i class="bi bi-check-circle-fill me-2"></i>Request Submitted Successfully</h5>
      </div>

      <div class="modal-footer">
        <button class="btn btn-success w-100" data-bs-dismiss="modal">OK</button>
      </div>

    </div>
  </div>
</div>
<!-- REQUEST MODAL -->
<div class="modal fade" id="requestModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
  <h5><i class="bi bi-pencil-square me-2"></i>Request Change</h5>
  <button class="btn-close" data-bs-dismiss="modal"></button>
</div>

      <div class="modal-body">

        <input id="req_roll" class="form-control mb-2" placeholder="Roll Number">

        <select id="req_subject" class="form-control mb-2"></select>

        <input id="req_external" class="form-control mb-2" placeholder="New External Marks">

        <input id="req_proof" class="form-control" placeholder="Google Drive Link">

      </div>

      <div class="modal-footer">
        <button class="btn btn-primary w-100" onclick="submitRequest()">Submit</button>
      </div>

    </div>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div class="modal fade" id="adminModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header"><h5><i class="bi bi-shield-lock-fill me-2"></i>Admin Login</h5></div>

      <div class="modal-body">
        <input id="adminKey" type="password" class="form-control" placeholder="Admin Key">
      </div>

      <div class="modal-footer">
        <button class="btn btn-success w-100" onclick="loadRequests()">Login</button>
      </div>

    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="modal fade" id="adminPanel">
  <div class="modal-dialog modal-xl modal-fullscreen-sm-down">
    <div class="modal-content">

      <div class="modal-header">
        <h5><i class="bi bi-speedometer2 me-2"></i>Admin Panel</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="text-center mb-3">
          <button class="btn btn-dark me-2" onclick="loadRequests()">Pending</button>
          <button class="btn btn-success me-2" onclick="loadApproved()">Approved</button>
          <button class="btn btn-danger" onclick="loadRejected()">Rejected</button>
        </div>

        <div id="adminBody"></div>

      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
